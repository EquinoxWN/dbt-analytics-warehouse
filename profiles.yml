# Local DuckDB warehouse; everything stays inside the repository (data/ is git-ignored).
analytics_warehouse:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('DAW_DUCKDB_PATH', 'data/warehouse.duckdb') }}"
      threads: 2
      settings:
        memory_limit: "1GB"
        # Never download DuckDB extensions; parquet and csv readers are built in.
        autoinstall_known_extensions: false
        autoload_known_extensions: false
