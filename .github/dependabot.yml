# Update pull requests are paused so the repository keeps a single main branch; CI audits dependencies on every push.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  # pyproject.toml ranges and the exact pins in constraints.txt.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
